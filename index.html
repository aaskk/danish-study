k", "box": 1, "next": "2026-10-16", "wrong": 0}, {"id": "perfektum (har/er)", "da": "perfektum (har/er)", "en": "present perfect: har + participle for most verbs; er + participle for motion/change of state", "ex": "Jeg har sendt en ansøgning. Hun er blevet syg.", "type": "grammar", "topic": "everyday", "box": 1, "next": "2026-10-16", "wrong": 0}, {"id": "at møde op", "da": "at møde op", "en": "to show up / report for work or an appointment", "ex": "Har du mødt op til mødet?", "type": "phrase", "topic": "work", "box": 1, "next": "2026-10-16", "wrong": 0}, {"id": "en recept", "da": "en recept", "en": "a prescription (from a doctor)", "ex": "Lægen har skrevet en recept.", "type": "noun", "topic": "health", "box": 1, "next": "2026-10-16", "wrong": 0}, {"id": "at bo til leje", "da": "at bo til leje", "en": "to rent / live as a tenant", "ex": "Vi boede til leje i tre år, før vi købte.", "type": "phrase", "topic": "housing", "box": 1, "next": "2026-10-15", "wrong": 0}, {"id": "omvendt ordstilling (V2)", "da": "omvendt ordstilling (V2)", "en": "inversion: after a fronted time/place phrase, verb comes before the subject in main clauses", "ex": "I går cyklede jeg på arbejde.", "type": "grammar", "topic": "everyday", "box": 1, "next": "2026-10-15", "wrong": 0}, {"id": "et sygehus", "da": "et sygehus", "en": "a hospital", "ex": "Hun arbejder på et stort sygehus i København.", "type": "noun", "topic": "health", "box": 1, "next": "2026-10-16", "wrong": 1}, {"id": "en frokostpause", "da": "en frokostpause", "en": "a lunch break", "ex": "I frokostpausen spiser vi ofte i kantinen.", "type": "noun", "topic": "work", "box": 1, "next": "2026-10-15", "wrong": 0}, {"id": "en læge", "da": "en læge", "en": "a doctor", "ex": "Jeg skal ringe til lægen i morgen.", "type": "noun", "topic": "health", "box": 1, "next": "2026-10-15", "wrong": 0}, {"id": "fordi (+ ledsætning)", "da": "fordi (+ ledsætning)", "en": "because — subordinate clause: adverb (ikke) goes BEFORE the verb", "ex": "Jeg kommer var LESSONS=[{"date": "2026-10-14", "title": "Omvendt ordstilling (V2)", "doneDefault": true, "explanation": "In a Danish main clause the **conjugated verb is always in 2nd place**.\nIf you start with a time or place phrase, the subject moves **after** the verb:\n- *I går cyklede jeg på arbejde.* (not ~~I går jeg cyklede~~)\n- *I frokostpausen spiser vi ofte i kantinen.*\nIn a subordinate clause (after *fordi*, *selvom*), *ikke* goes **before** the verb: *…fordi jeg ikke har tid.*", "words": [{"da": "et sygehus", "en": "a hospital", "ex": "Hun arbejder på et stort sygehus i København."}, {"da": "at bo til leje", "en": "to rent your home / live as a tenant", "ex": "Vi boede til leje i tre år."}, {"da": "en frokostpause", "en": "a lunch break", "ex": "I frokostpausen spiser vi ofte i kantinen."}], "examples": ["I går cyklede jeg på arbejde.", "I frokostpausen spiser vi ofte i kantinen.", "Jeg søger ikke jobbet, fordi jeg ikke har tid."], "quiz": [{"q": "Rewrite so it starts with *I morgen*: Jeg ringer til lægen i morgen.", "a": ["I morgen ringer jeg til lægen"], "x": "Fronted time phrase → verb (ringer) second, then the subject (jeg)."}, {"q": "Translate: We live in a small apartment and pay rent.", "a": ["Vi bor i en lille lejlighed og betaler husleje", "Vi bor i en lille lejlighed og betaler leje", "Vi bor i en lille lejlighed, og vi betaler husleje"], "x": "*lejlighed* is an en-word (en lille lejlighed); and = *og*; pay = *betaler*.", "self": true}, {"q": "Jeg søger ikke jobbet, fordi jeg ___ har tid.", "a": ["ikke"], "x": "In a fordi-clause, *ikke* goes before the verb."}]}, {"date": "2026-10-15", "title": "Perfektum: har eller er?", "doneDefault": true, "explanation": "Perfektum = **har/er + past participle**, for something in the past that still matters now.\n- Most verbs take **har**: *Jeg har sendt en ansøgning.*\n- Verbs of **movement** or **change of state** take **er**: *Vi er kommet.* / *Hun er blevet syg.*\nQuick test: did someone *go somewhere* or *becom  for(var i=0;i<answers.length;i++){if(norm(answers[i])===n)return {ok:true,exact:true,ans:answers[i]};}
 for(var j=0;j<answers.length;j++){if(fold(answers[j])===f)return {ok:true,exact:false,ans:answers[j]};}
 return {ok:false,ans:answers[0]};}

/* ---------- Text-to-speech (Danish) ---------- */
var TTS={ok:("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined",voice:null,checked:false};
function pickVoice(){if(!TTS.ok)return null;var vs=[];try{vs=window.speechSynthesis.getVoices()||[];}catch(e){vs=[];}
 if(vs.length)TTS.checked=true;
 var da=vs.filter(function(v){return /^da([-_]|$)/i.test(v.lang||"");});
 TTS.voice=da.filter(function(v){return /sara/i.test(v.name);})[0]||da.filter(function(v){return /^da[-_]DK$/i.test(v.lang);})[0]||da[0]||null;
 renderTtsHint();return TTS.voice;}
if(TTS.ok){pickVoice();try{window.speechSynthesis.addEventListener("voiceschanged",pickVoice);}catch(e){window.speechSynthesis.onvoiceschanged=pickVoice;}
 setTimeout(function(){TTS.checked=true;pickVoice();},2000);}
var TTS_HINT="Add a Danish voice in iPhone Settings > Accessibility > Spoken Content > Voices > Danish";
function renderTtsHint(){var el=document.getElementById("ttshint");if(!el)return;var show=!TTS.ok||(TTS.checked&&!TTS.voice);el.style.display=show?"block":"none";el.textContent=TTS.ok?TTS_HINT:"Audio is not supported in this browser.";}
function cleanSay(t){return String(t||"").replace(/\*\*?|~~/g,"").replace(/\s*\/\s*/g,", ").replace(/\s+/g," ").trim();}
function speak(text){if(!TTS.ok){renderTtsHint();return;}var t=cleanSay(text);if(!t)return;
 try{window.speechSynthesis.cancel();}catch(e){}
 var u=new SpeechSynthesisUtterance(t);u.lang=(TTS.voice&&TTS.voice.lang)||"da-DK";if(TTS.voice||pickVoice())u.voice=TTS.voice;u.rate=S.rate||0.9;u.pitch=1;
 try{window.speechSynthesis.speak(u);}catch(e){}
 if(!TTS.voice){TTS.checked=true;renderTtsHint();}}
function spk(text,small){if(!text)return "";return '<button type="button" class="spk'+(small?' sm':'')+'" data-say="'+esc(cleanSay(text))+'" aria-label="Læs højt">🔊</button>';}
// capture phase: runs before card flip handlers, directly inside the user tap (required on iOS)
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-say]");if(!b)return;e.preventDefault();e.stopPropagation();speak(b.getAttribute("data-say"));},true);
// Fill ___ blanks with the answer, drop hints like "(stor)" and English instructions
function filled(q,ans){q=String(q||"").replace(/\*/g,"");ans=String(ans||"");
 var n=(q.match(/___/g)||[]).length;if(!n)return ans;
 var w=ans.split(/\s+/),parts;
 if(n===1)parts=[ans];else if(w.length===n)parts=w;else return ans;
 var i=0,out=q.replace(/___/g,function(){return parts[i++];});
 out=out.replace(/\s*\([^)]*\)/g,"").replace(/\s*\b(Write|Fill|Translate|Rewrite|Fix|Choose)\b[^.]*\.?\s*$/,"").replace(/^[^:]*\b(Fill in|Translate|Rewrite|Fix)[^:]*:\s*/i,"");
 return out.replace(/^…,?\s*/,"").replace(/\s+([.,!?])/g,"$1").replace(/\s+/g," ").trim();}

function tzLabel(){var o=-new Date().getTimezoneOffset();return "UTC"+(o>=0?"+":"-")+Math.floor(Math.abs(o)/60)+(Math.abs(o)%60?":"+p2(Math.abs(o)%60):"");}

function buildReport(ev){
 var L=["DANSK-APP RAPPORT"];
 if(!ev.length){L.push("Ingen ny aktivitet siden "+(S.lastExportedAt?fmtTs(S.lastExportedAt)+" ("+tzLabel()+")":"start")+".");return L.join("\n");}
 var from=S.lastExportedAt?S.lastExportedAt:ev[0].t,to=ev[ev.length-1].t;
 L.push("Periode: "+fmtTs(from)+" -> "+fmtTs(to)+" ("+tzLabel()+")"+(S.lastExportedAt?"":" [første rapport]"));
 function cnt(k){var a=ev.filter(function(x){return x.k===k;});return {n:a.length,ok:a.filter(function(x){return x.ok;}).length};}
 var c=cnt("card"),q=cnt("quiz"),d=cnt("drill"),l=cnt("lesson"),m=cnt("mistake");
 var done=ev.filter(function(x){return x.k==="lessonDone";});
 L.push("Kort: "+c.n+" gennemgået, "+c.ok+" kunne, "+(c.n-c.ok)+" kunne ikke");
 L.push("Quiz: "+q.ok+"/"+q.n+" rigtige");
 L.push("Grammatik-drills: "+d.ok+"/"+d.n+" rigtige");
 L.push("Lektions-quiz: "+l.ok+"/"+l.n+" rigtige ("+ev.filter(function(x){return x.k==="lesson"&&x.self;}).length+" selvvurderet)");
 L.push("Lektioner færdige: "+(done.length?done.map(function(x){return x.item+" ("+x.score+"/"+x.of+")";}).join("; "):"0"));
 L.push("Fejl-review: "+m.n+" ("+m.ok+" har den, "+(m.n-m.ok)+" stadig svær)");
 // misses aggregated by kind+item

 ev.forEach(function(x){if(x.ok||x.k==="card"||x.k==="lessonDone"||x.k==="mistake")return;var key=x.k+"|"+x.item;
  if(!miss[key]){miss[key]={x:x,n:0,typed:[]};order.push(key);}var a=miss[key];a.n++;var t=oneLine(x.typed);if(t&&a.typed.indexOf(t)<0)a.typed.push(t);});
 L.push("");L.push("FEJL ("+order.length+"):");
 if(!order.length)L.push("- ingen");
 order.forEach(function(k){var a=miss[k],x=a.x;L.push("- ["+x.k+" | "+oneLine(x.topic)+"] "+oneLine(x.item)+" | skrev: "+a.typed.map(function(t){return '"'+t+'"';}).join(", ")+" | rigtigt: \""+oneLine(x.correct)+"\""+(x.self?" | selvvurderet":"")+(a.n>1?" | x"+a.n:""));});
 var dc={},dorder=[];ev.forEach(function(x){if(x.k!=="card"||x.ok)return;if(!dc[x.item]){dc[x.item]={x:x,n:0};dorder.push(x.item);}dc[x.item].n++;});
 L.push("");L.push("KORT 'KUNNE IKKE' ("+dorder.length+"):");
 if(!dorder.length)L.push("- ingen");
 dorder.forEach(function(k){var a=dc[k];L.push("- "+oneLine(k)+" = "+oneLine(a.x.correct)+" ["+oneLine(a.x.topic)+"]"+(a.n>1?" | x"+a.n:""));});
 var hard=ev.filter(function(x){return x.k==="mistake"&&!x.ok;});
 if(hard.length){L.push("");L.push("FEJL-LOG 'STADIG SVÆR':");var seen={};hard.forEach(function(x){if(seen[x.item])return;seen[x.item]=1;L.push("- "+oneLine(x.item)+" -> "+oneLine(x.correct)+" ["+oneLine(x.topic)+"]");});}
 L.push("SLUT");
 return L.join("\n");}

function renderCard(){
 var dirHtml='<div class="seg"><button id="dDA" class="'+(S.dir==="da"?"on":"")+'">DA → EN</button><button id="dEN" class="'+(S.dir==="en"?"on":"")+'">EN → DA</button></div>';
 if(fc.i>=fc.queue.length){
  app.innerHTML=dirHtml+'<div class="card" style="text-align:center"><h2>Færdig! 🎉</h2><p>'+(fc.done?('Du gennemgik '+fc.done+' kort.'):'Ingen kort skal gentages lige nu.')+'</p><button class="btn primary" id="all">Øv alle kort alligevel</button>'+(fc.done?tutorBtn():'')+'</div>';
  bindDir();$("all").onclick=function(){buildQueue(true);renderCard();};return;}
 var c=fc.queue[fc.i],s=st(c);
 var front=S.dir==="da"?c.da:c.en,back=S.dir==="da"?c.en:c.da;
 app.innerHTML=dirHtml+'<div class="bar"><div style="width:'+Math.round(fc.i/fc.queue.length*100)+'%"></div></div>'+
 '<p class="small muted">'+(fc.i+1)+' / '+fc.queue.length+' · Kasse '+s.box+'</p>'+
 '<div class="card flip" id="flip"><div><span class="tag">'+esc(c.type)+'</span><span class="tag">'+esc(c.topic)+'</span>'+(s.wrong>0?'<span class="tag warn">✗ '+s.wrong+'</span>':'')+'</div>'+
 '<div class="big">'+esc(front)+(S.dir==="da"?spk(c.da):'')+'</div>'+
 (fc.flipped?'<hr style="width:60%;border:0;border-top:1px solid var(--line)"><div class="big" style="font-size:22px">'+esc(back)+(S.dir==="en"?spk(c.da):'')+'</div>'+(c.ex?'<div class="ex">'+esc(c.ex)+spk(c.ex,1)+'</div>':''):'<p class="muted small">Tryk for at vende (tap to flip)</p>')+
 '</div>'+
 (fc.flipped?'<div class="row"><button class="btn bad" id="no">✗ Didn\'t</button><button class="btn ok" id="yes">✓ Knew it</button></div>':'<button class="btn primary" id="show">Vis svar</button>');
 bindDir();
 $("flip").onclick=function(){fc.flipped=!fc.flipped;renderCard();};
 if(fc.flipped){$("yes").onclick=function(){grade(true);};$("no").onclick=function(){grade(false);};}
 else $("show").onclick=function(){fc.flipped=true;renderCard();};
}
function bindDir(){$("dDA").onclick=function(){S.dir="da";save();fc.flipped=false;renderCard();};$("dEN").onclick=function(){S.dir="en";save();fc.flipped=false;renderCard();};}
function grade(ok){var c=fc.queue[fc.i],s=st(c);s.seen=(s.seen||0)+1;
 if(ok){s.box=Math.min(5,s.box+1);s.next=addDays(INTERVAL[s.box]);}
 else{s.box=1;s.wrong=(s.wrong||0)+1;s.next=today();
  // see it again later this session
  if(fc.queue.slice(fc.i+1).indexOf(c)<0)fc.queue.push(c);}
 setSt(c,s);tick(ok);logEv({k:"card",ok:ok,item:c.da,correct:c.en,topic:c.topic,dir:S.dir});fc.done++;fc.i++;fc.flipped=false;renderCard();}

/* MCQ quiz */
var qz=null;
function makeVocabQ(){var pool=CARDS.filter(function(c){return c.type!=="grammar";});
 var c=pool[Math.floor(Math.random()*pool.length)];var rev=Math.random()<0.5;
 var others=shuffle(pool.filter(function(o){return o!==c&&(o.type===c.type||Math.random()<0.3);})).slice(0,3);
 if(others.length<3)others=shuffle(pool.filter(function(o){return o!==c;})).slice(0,3);
 var opts=shuffle([c].concat(others));
 return {q:rev?'What is the Danish for: "'+c.en+'"?':'What does "'+c.da+'" mean?',o:opts.map(function(o){return rev?o.da:o.en;}),c:opts.indexOf(c),x:c.ex?("Eksempel: "+c.ex):"",card:c};}
function quizView(){var qs=[];var g=shuffle(GMCQ).slice(0,5);for(var i=0;i<5;i++)qs.push(makeVocabQ());
 qz={qs:shuffle(qs.concat(g)),i:0,score:0,answered:false};renderQ();}
function renderQ(){
 if(qz.i>=qz.qs.length){app.innerHTML='<div class="card" style="text-align:center"><h2>'+qz.score+' / '+qz.qs.length+'</h2><p>'+(qz.score>=8?"Flot klaret! 🎉":qz.score>=5?"Godt gået! 👍":"Bliv ved! 💪")+'</p><button class="btn primary" id="again">Ny quiz</button>'+tutorBtn()+'</div>';$("again").onclick=quizView;return;}
 var q=qz.qs[qz.i];
 app.innerHTML='<div class="bar"><div style="width:'+Math.round(qz.i/qz.qs.length*100)+'%"></div></div><p class="small muted">Spørgsmål '+(qz.i+1)+' / '+qz.qs.length+' · Score '+qz.score+'</p>'+
 '<div class="card"><div class="prompt">'+esc(q.q)+'</div>'+q.o.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+esc(o)+'</button>';}).join("")+'<div id="fb"></div></div>';
 app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(qz.answered)return;qz.answered=true;var i=+b.dataset.i,ok=i===q.c;
  if(ok)qz.score++;app.querySelectorAll(".opt")[q.c].classList.add("right");if(!ok)b.classList.add("wrong");
  if(q.card&&!ok){var s=st(q.card);s.wrong=(s.wrong||0)+1;s.box=1;s.next=today();setSt(q.card,s);}
  tick(ok);logEv({k:"quiz",ok:ok,item:q.q,typed:q.o[i],correct:q.o[q.c],topic:q.card?("ord: "+q.card.topic):"grammatik"});
  $("fb").innerHTML='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?"Rigtigt! ✅":"Ikke helt ❌ — "+esc(q.o[q.c]))+'</b>'+spk(q.card?q.card.da:filled(q.q,q.o[q.c]),1)+(q.x?'<br><span class="small">'+esc(q.x)+'</span>':'')+'</div><button class="btn primary" id="nx">Næste →</button>';
  $("nx").onclick=function(){qz.i++;qz.answered=false;renderQ();};};});
}

/* Typed drills */
var dr=null,drTopic=S.drTopic||"all";
function drillView(){var topics=[];DRILLS.forEach(function(d){if(topics.indexOf(d.t)<0)topics.push(d.t);});
 var pool=DRILLS.filter(function(d){return drTopic==="all"||d.t===drTopic;});
 dr={list:shuffle(pool).slice(0,drTopic==="all"?12:pool.length),i:0,score:0,answered:false,topics:topics};renderDrill();}
function startTopicDrill(t){drTopic=t;S.drTopic=t;save();go("drill");}
function renderDrill(){
 var sel='<select id="tsel"><option value="all">Alle emner (12 random)</option>'+dr.topics.map(function(t){return '<option value="'+esc(t)+'"'+(t===drTopic?" selected":"")+'>'+esc(t)+'</option>';}).join("")+'</select>';
 if(dr.i>=dr.list.length){app.innerHTML=sel+'<div class="card" style="text-align:center"><h2>'+dr.score+' / '+dr.list.length+'</h2><p>'+(dr.score===dr.list.length?"Perfekt! 🎉":"Godt arbejde! Prøv igen for at øve mere.")+'</p><button class="btn primary" id="again">Igen</button>'+tutorBtn()+'</div>';
  bindSel();$("again").onclick=drillView;return;}
 var d=dr.list[dr.i];
 app.innerHTML=sel+'<div class="bar"><div style="width:'+Math.round(dr.i/dr.list.length*100)+'%"></div></div><p class="small muted">'+(dr.i+1)+' / '+dr.list.length+' · '+esc(d.t)+' · Score '+dr.score+'</p>'+
 '<div class="card"><div class="prompt">'+esc(d.q).replace(/___/g,'<b>____</b>')+'</div>'+
 '<form id="f" autocomplete="off"><input type="text" id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Skriv dit svar…">'+
 '<button class="btn primary" type="submit" id="sub">Tjek</button></form><div id="fb"></div></div>'+
 '<p class="small muted">Tip: ae / oe / aa are accepted for æ / ø / å.</p>';
 bindSel();var inp=$("ans");
 $("f").onsubmit=function(e){e.preventDefault();if(dr.answered){dr.i++;dr.answered=false;renderDrill();return;}
  if(!inp.value.trim())return;var r=check(inp.value,d.a);dr.answered=true;if(r.ok)dr.score++;
  var ds=S.drillStats[d.t]||{ok:0,n:0};ds.n++;if(r.ok)ds.ok++;S.drillStats[d.t]=ds;tick(r.ok);logEv({k:"drill",ok:r.ok,item:d.q,typed:inp.value,correct:d.a[0],topic:d.t});
  inp.readOnly=true;$("sub").textContent="Næste →";
  $("fb").innerHTML='<div class="fb '+(r.ok?"ok":"bad")+'"><b>'+(r.ok?(r.exact?"Rigtigt! ✅":"Rigtigt! ✅ Correct spelling: "+esc(r.ans)):"Ikke helt ❌")+'</b>'+
   (!r.ok?'<br>Svar: <b>'+esc(d.a[0])+'</b>':'')+spk(filled(d.q,d.a[0]),1)+'<br><span class="small">'+esc(d.x)+'</span></div>';};
 setTimeout(function(){try{inp.focus();}catch(e){}},50);
}
function bindSel(){$("tsel").onchange=function(){drTopic=this.value;S.drTopic=drTopic;save();drillView();};}

/* Mistakes */
var PATTERN_TOPIC={"gender en/et":"en/et","spelling":"datid/perfektum","word order":"V2","har/er":"har/er","adjective endings":"adjektiv (ubestemt)","prepositions":"præpositioner"};
function mistView(){
 var hard=CARDS.filter(function(c){return st(c).wrong>0;}).sort(function(a,b){return st(b).wrong-st(a).wrong;});
 var h='<h2>Mine fejl</h2><p class="small muted">From your Notion error log. Try to correct each one in your head, then tap to check.</p>';
 ERRORS.forEach(function(e,i){var m=S.mist[i]||{};
  h+='<div class="card"><span class="tag">'+esc(e.pattern)+'</span><span class="tag">'+esc(e.date)+'</span>'+(m.ok?'<span class="tag">✓ '+m.ok+'</span>':'')+
  '<p class="prompt"><span class="strike">'+esc(e.mistake)+'</span></p>'+
  '<div id="mc'+i+'"><button class="btn" data-r="'+i+'">Vis rettelse</button></div></div>';});
 h+='<div class="card"><h3>Øv dine fejl-mønstre</h3>'+
  '<button class="btn" data-t="en/et">en / et (køn)</button><button class="btn" data-t="datid/perfektum">Stavning & datid (cyklede)</button><button class="btn" data-t="V2">Ordstilling (V2)</button></div>';
 h+='<div class="card"><h3>Svære kort ('+hard.length+')</h3>'+(hard.length?hard.map(function(c){return '<p><b>'+esc(c.da)+'</b> — '+esc(c.en)+' <span class="tag warn">✗ '+st(c).wrong+'</span></p>';}).join("")+'<button class="btn primary" id="hardgo">Øv svære kort</button>':'<p class="muted">Ingen endnu 🎉</p>')+'</div>';
 app.innerHTML=h;
 app.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){var i=+b.dataset.r,e=ERRORS[i];
  $("mc"+i).innerHTML='<div class="fb ok">✅ '+esc(e.correction)+'</div><div class="row"><button class="btn bad" data-m="'+i+'" data-v="0">Stadig svær</button><button class="btn ok" data-m="'+i+'" data-v="1">Jeg har den</button></div>';
  $("mc"+i).querySelectorAll("[data-m]").forEach(function(x){x.onclick=function(){var m=S.mist[i]||{ok:0,no:0};if(x.dataset.v==="1")m.ok++;else m.no++;S.mist[i]=m;save();tick(x.dataset.v==="1");logEv({k:"mistake",ok:x.dataset.v==="1",item:e.mistake,correct:e.correction,topic:e.pattern});
   $("mc"+i).innerHTML='<div class="fb ok">✅ '+esc(e.correction)+'</div><p class="small muted">Gemt.</p>';};});};});
 app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){startTopicDrill(b.dataset.t);};});
 if($("hardgo"))$("hardgo").onclick=function(){go("cards");fc={queue:hard.slice(),i:0,flipped:false,done:0};renderCard();};
}

renderStats();renderBadge();go("home");
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script>
